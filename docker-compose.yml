services:
  db:
    image: docker.io/library/mysql:8.0
    container_name: cleanlytemizlik-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cleanly
      MYSQL_USER: cleanly
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33061:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cleanlytemizlik-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cleanly
      DB_USERNAME: cleanly
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
